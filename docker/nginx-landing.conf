# Static server for the landing site. Mirrors what apps/landing/vercel.json did on Vercel:
# clean URLs (/about serves about.html, /about.html redirects to /about) and the same caching.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    # Behind Coolify's TLS proxy nginx only sees http; relative Location headers keep redirects on https.
    absolute_redirect off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml;

    # Matched on the original request, so the internal .html lookups below never loop back here.
    if ($request_uri ~ ^(.*/)index\.html(\?.*)?$) { return 301 $1$2; }
    if ($request_uri ~ ^(.+)\.html(\?.*)?$)       { return 301 $1$2; }

    location ~* \.png$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri $uri.html $uri/index.html =404;
    }
}
