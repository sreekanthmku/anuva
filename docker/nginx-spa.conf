# Static server for the Vite SPAs. TLS is terminated by Coolify's proxy in front of this.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    # Behind Coolify's TLS proxy nginx only sees http; relative Location headers keep redirects on https.
    absolute_redirect off;

    # nginx's stock mime.types serves this as application/octet-stream.
    types {
        application/manifest+json webmanifest;
    }
    include /etc/nginx/mime.types;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Content-hashed bundles never change under the same name: cache them for a year.
    # A missing file is a real 404 — never index.html, which a browser would try to run as JS.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Service workers, their config and the manifest must always revalidate, or a deploy never
    # reaches an installed app and push config goes stale.
    location ~ ^/(sw\.js|registerSW\.js|workbox-[^/]+\.js|firebase-messaging-sw\.js|firebase-config\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Everything else: the file if it exists, otherwise the SPA shell (client-side routes).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
