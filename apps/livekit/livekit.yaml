# Local self-hosted LiveKit server for Phase 1 consultation calls.
# Redis is local-only and used by the Egress worker for audio recording coordination.

port: 7880

redis:
  address: 127.0.0.1:6379

rtc:
  port_range_start: 50000
  port_range_end: 50100
  tcp_port: 7881
  use_external_ip: false

keys:
  devkey: devsecret

# The API starts participant egress from these events. track_published tells it when a
# participant actually has a mic to record; the egress_* events drive recording status.
# Signed with the secret for `api_key` below, and verified by the API.
webhook:
  api_key: devkey
  urls:
    - http://127.0.0.1:3001/livekit/webhook

logging:
  level: info

room:
  empty_timeout: 600
  departure_timeout: 120
  max_participants: 2
