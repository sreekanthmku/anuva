<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Anuva Wellness</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: "Geist", -apple-system, system-ui, sans-serif;
    background: #141219;
    color: #e6e0ea;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    background-image:
      radial-gradient(ellipse at top, rgba(206, 189, 255, 0.10) 0%, transparent 50%),
      radial-gradient(ellipse at bottom right, rgba(248, 113, 113, 0.08) 0%, transparent 50%);
  }
  button { font-family: inherit; }
  input, textarea { font-family: inherit; }
  ::-webkit-scrollbar { width: 0; height: 0; }

  .stage {
    min-height: 100vh;
    padding: 50px 24px 100px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 50px;
  }

  .page-head {
    max-width: 1400px; width: 100%;
    display: flex; justify-content: space-between; align-items: flex-end;
    gap: 40px;
    padding: 8px 8px 0;
  }
  .page-head h1 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 400; font-size: 50px; line-height: 1.0;
    margin: 0; color: #e6e0ea; letter-spacing: -0.025em;
    font-variation-settings: "opsz" 144;
    text-wrap: pretty;
  }
  .page-head h1 em { font-style: italic; color: #cebdff; font-weight: 300; }
  .page-head .kicker {
    font-family: "Geist Mono", ui-monospace, monospace; font-size: 10.5px;
    letter-spacing: 0.22em; text-transform: uppercase; color: #a78bfa;
    margin-bottom: 14px;
    display: flex; align-items: center; gap: 8px;
  }
  .page-head .kicker::before {
    content: ''; width: 14px; height: 1px; background: #a78bfa; opacity: 0.5;
  }
  .page-head p {
    font-family: "Geist", sans-serif; font-size: 13.5px;
    color: #cac4d4; max-width: 380px; margin: 0; line-height: 1.55;
  }

  .phone-wrap {
    width: 390px; height: 812px;
    border-radius: 48px;
    background: #000;
    padding: 10px;
    box-shadow:
      0 40px 80px rgba(0,0,0,0.6),
      0 0 0 1px rgba(167, 139, 250, 0.2),
      0 0 80px rgba(206, 189, 255, 0.10);
    position: relative;
    flex-shrink: 0;
  }
  .phone-inner {
    width: 100%; height: 100%;
    border-radius: 40px;
    overflow: hidden;
    background: #141219;
    display: flex; flex-direction: column;
    position: relative;
  }
  .phone-inner .screen-body {
    flex: 1; overflow: hidden;
    display: flex; flex-direction: column;
  }
  .notch {
    position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
    width: 110px; height: 32px; border-radius: 20px;
    background: #000; z-index: 50;
  }

  .row {
    max-width: 1400px; width: 100%;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 60px 32px;
    justify-items: center;
  }

  .frame-card { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .frame-label {
    font-family: "Geist Mono", ui-monospace, monospace; font-size: 10.5px;
    letter-spacing: 0.22em; text-transform: uppercase; color: #cac4d4;
    display: flex; align-items: center; gap: 10px;
  }
  .frame-label .num {
    background: rgba(206, 189, 255, 0.16); color: #cebdff;
    width: 26px; height: 26px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-family: "Fraunces", serif; font-size: 12px; font-weight: 500;
    letter-spacing: 0;
    border: 1px solid rgba(206, 189, 255, 0.3);
  }
  .frame-title {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 400; font-size: 22px; color: #e6e0ea; margin: 0;
    letter-spacing: -0.02em;
    font-variation-settings: "opsz" 96;
    text-align: center;
  }
  .frame-title em { font-style: italic; color: #cebdff; }
  .frame-sub {
    font-family: "Geist", sans-serif; font-size: 11.5px;
    color: #948e9d; text-align: center; max-width: 340px; line-height: 1.5; margin: 0;
  }

  .divider {
    max-width: 1400px; width: 100%;
    border-top: 1px solid rgba(167, 139, 250, 0.2);
    padding-top: 30px;
    font-family: "Geist Mono", ui-monospace, monospace;
    font-size: 10.5px; letter-spacing: 0.22em; text-transform: uppercase;
    color: #948e9d;
  }

  /* Prototype hero */
  .hero {
    max-width: 1400px; width: 100%;
    background:
      radial-gradient(ellipse at top right, rgba(206, 189, 255, 0.14) 0%, transparent 55%),
      linear-gradient(165deg, #173028 0%, #0F2018 60%);
    color: #e6e0ea;
    border-radius: 32px;
    padding: 50px 52px;
    display: flex; justify-content: space-between; align-items: flex-end;
    gap: 40px;
    position: relative; overflow: hidden;
    border: 1px solid rgba(167, 139, 250, 0.2);
  }
  .hero h1 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 400; font-size: 64px; line-height: 0.98;
    margin: 0; color: #e6e0ea;
    letter-spacing: -0.03em;
    font-variation-settings: "opsz" 144;
  }
  .hero h1 em { font-style: italic; color: #cebdff; font-weight: 300; }
  .hero .tag {
    font-family: "Geist Mono", ui-monospace, monospace;
    font-size: 10.5px; letter-spacing: 0.25em;
    text-transform: uppercase; color: #cebdff; margin-bottom: 18px;
    display: flex; align-items: center; gap: 8px;
  }
  .hero .tag::before {
    content: ''; width: 14px; height: 1px; background: #cebdff; opacity: 0.5;
  }
  .hero p {
    max-width: 380px; font-size: 14px;
    color: rgba(244,246,242,0.65); line-height: 1.55;
    margin: 0 0 8px; text-align: right;
  }
  .hero .meta {
    font-family: "Geist Mono", ui-monospace, monospace; font-size: 10px;
    color: rgba(244,246,242,0.4); letter-spacing: 0.15em;
    text-transform: uppercase; text-align: right;
  }

  /* Prototype screen switcher */
  .proto-wrap {
    display: flex; gap: 36px; align-items: flex-start;
    max-width: 1400px; width: 100%;
    justify-content: center;
  }
  .screen-menu {
    width: 260px; flex-shrink: 0;
    background: #1d1a21;
    border: 1px solid rgba(167, 139, 250, 0.2);
    border-radius: 22px;
    padding: 20px;
    position: sticky; top: 24px;
  }
  .screen-menu .hdr {
    font-family: "Geist Mono", ui-monospace, monospace;
    font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
    color: #948e9d; margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(167, 139, 250, 0.2);
  }
  .screen-menu button {
    display: flex; align-items: center; gap: 12px;
    width: 100%; padding: 9px 12px; background: transparent;
    border: none; border-radius: 10px; cursor: pointer;
    font-family: "Geist", sans-serif; font-size: 13px;
    color: #cac4d4; text-align: left;
    margin-bottom: 2px;
    transition: all 140ms;
  }
  .screen-menu button:hover { background: rgba(206, 189, 255, 0.16); color: #e6e0ea; }
  .screen-menu button.active {
    background: #e2c62d; color: #141219; font-weight: 500;
  }
  .screen-menu .num {
    font-family: "Geist Mono", ui-monospace, monospace;
    font-size: 10px; color: #948e9d; width: 22px; flex-shrink: 0;
    letter-spacing: 0.05em;
  }
  .screen-menu button.active .num { color: rgba(57, 48, 0, 0.75); }

  /* Tweaks panel */
  .tweaks {
    position: fixed; bottom: 24px; right: 24px;
    width: 290px; background: #1d1a21; color: #e6e0ea;
    border: 1px solid rgba(148, 142, 157, 0.35);
    border-radius: 20px; padding: 18px;
    box-shadow: 0 24px 48px rgba(0,0,0,0.45);
    z-index: 100;
    display: none;
  }
  .tweaks.on { display: block; }
  .tweaks .hdr {
    font-family: "Fraunces", serif;
    font-size: 18px; color: #cebdff; margin-bottom: 14px;
    display: flex; justify-content: space-between; align-items: center;
    font-style: italic; font-weight: 400;
  }
  .tweaks label {
    display: block; font-family: "Geist Mono", ui-monospace, monospace;
    font-size: 9.5px; color: #948e9d;
    letter-spacing: 0.18em; text-transform: uppercase;
    margin: 12px 0 8px;
  }
  .tweaks .swatches { display: flex; gap: 8px; }
  .tweaks .swatch {
    width: 30px; height: 30px; border-radius: 50%;
    cursor: pointer; border: 2px solid transparent;
    transition: transform 120ms;
  }
  .tweaks .swatch:hover { transform: scale(1.1); }
  .tweaks .swatch.sel { border-color: #e6e0ea; }

  @media (max-width: 1200px) {
    .row { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 800px) {
    .row { grid-template-columns: 1fr; }
    .hero { flex-direction: column; align-items: flex-start; }
    .hero p, .hero .meta { text-align: left; }
    .proto-wrap { flex-direction: column; align-items: center; }
    .screen-menu { width: 390px; position: static; }
  }
</style>
</head>
<body>

<div id="root"></div>

<script>
const TWEAKS = /*EDITMODE-BEGIN*/{
  "accentScheme": "mint",
  "userName": "Priya",
  "phaseLabel": "Perimenopause"
}/*EDITMODE-END*/;
</script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tokens.jsx"></script>
<script type="text/babel" src="screens-onboarding.jsx"></script>
<script type="text/babel" src="screens-core.jsx"></script>
<script type="text/babel" src="screens-care.jsx"></script>

<script type="text/babel">
const SCREENS = [
  { id: 'assess',   n: '01', title: 'Pre-Assessment',      sub: '4-step anonymous intake. No login.',                  comp: 'ScreenAssessment' },
  { id: 'result',   n: '02', title: 'Assessment Result',   sub: 'Indicators scored. Next steps outlined.',             comp: 'ScreenResult' },
  { id: 'paywall',  n: '03', title: 'Subscription',        sub: '3 plan options. 7-day trial. DPDP.',                  comp: 'ScreenPaywall' },
  { id: 'greeting', n: '04', title: 'ANU Greeting',        sub: 'Meet your companion. 7-day journey preview.',         comp: 'ScreenGreeting' },
  { id: 'home',     n: '05', title: 'Home Dashboard',      sub: 'Wellness ring, ANU prompt, daily insight.',           comp: 'ScreenHome' },
  { id: 'chat',     n: '06', title: 'ANU Chat',            sub: 'Private, encrypted, remembers everything.',           comp: 'ScreenChat' },
  { id: 'track',    n: '07', title: 'Daily Symptom Log',   sub: '4 categories, 7-segment intensity.',                  comp: 'ScreenTrack' },
  { id: 'report',   n: '08', title: 'Weekly Benchmark',    sub: '6 bars vs. cohort. Trend cards. ANU reflects.',       comp: 'ScreenReport' },
  { id: 'care',     n: '09', title: 'Care Direction',      sub: 'Recommended path + journey timeline.',                comp: 'ScreenCarePath' },
  { id: 'content',  n: '10', title: 'Library',             sub: 'Featured article, live masterclass, expert reads.',   comp: 'ScreenContent' },
  { id: 'qa',       n: '11', title: 'Anonymous Q&A',       sub: 'Ask without trace. Verified expert answers.',         comp: 'ScreenQA' },
  { id: 'booking',  n: '12', title: 'Consultation Booking',sub: 'First one free. 3 specialists. Reschedule anytime.',  comp: 'ScreenBooking' },
];

function Phone({ children }) {
  return (
    <div className="phone-wrap">
      <div className="phone-inner">
        <div className="notch"/>
        <StatusBar />
        <div className="screen-body">{children}</div>
        <HomeIndicator />
      </div>
    </div>
  );
}

function ScreenShell({ screenId, tab, setTab, navigate }) {
  const appScreens = ['home', 'chat', 'track', 'report', 'content', 'qa', 'booking', 'care'];
  const showNav = appScreens.includes(screenId);

  const props = {
    onComplete: () => navigate('result'),
    onContinue: () => {
      if (screenId === 'result') navigate('paywall');
      else if (screenId === 'greeting') navigate('home');
      else if (screenId === 'care') navigate('booking');
    },
    onSubscribe: () => navigate('greeting'),
    onBack: () => {
      const idx = SCREENS.findIndex(s => s.id === screenId);
      if (idx > 0) navigate(SCREENS[idx - 1].id);
    },
    onNav: (t) => {
      setTab(t);
      if (t === 'home') navigate('home');
      if (t === 'anu') navigate('chat');
      if (t === 'track') navigate('track');
      if (t === 'report') navigate('report');
      if (t === 'more') navigate('content');
    },
    onChat: () => navigate('chat'),
    onSave: () => navigate('report'),
  };

  const Comp = window[SCREENS.find(s => s.id === screenId).comp];

  return (
    <Phone>
      <Comp {...props} />
      {showNav && <BottomNav active={tab} onChange={props.onNav} />}
    </Phone>
  );
}

function CanvasView() {
  const [tab, setTab] = React.useState('home');

  return (
    <div className="stage">
      <div className="hero">
        <div>
          <div className="tag">Anuva Wellness · Mobile App</div>
          <h1>A soft place <em>to land.</em></h1>
        </div>
        <div>
          <p>A clinical wellness companion for Indian women navigating perimenopause and menopause. Private. Evidence-based. Quietly luminous.</p>
          <div className="meta">12 screens · Live prototype below</div>
        </div>
      </div>

      <div className="page-head">
        <div>
          <div className="kicker">The flow · 12 screens</div>
          <h1>From <em>first assessment</em> to first consultation.</h1>
        </div>
        <p>Each screen is designed to earn trust in seconds. Warm where it counts, clinical where it must be — never a lecture.</p>
      </div>

      <div className="row">
        {SCREENS.map(s => (
          <div key={s.id} className="frame-card" data-screen-label={`${s.n} ${s.title}`}>
            <ScreenShell screenId={s.id} tab={tab} setTab={setTab} navigate={() => {}} />
            <div className="frame-label"><span className="num">{s.n}</span> {s.title}</div>
            <p className="frame-sub">{s.sub}</p>
          </div>
        ))}
      </div>

      <div className="divider">Try it live ↓</div>

      <div className="page-head">
        <div>
          <div className="kicker">Interactive prototype</div>
          <h1>Tap through the <em>complete</em> flow.</h1>
        </div>
        <p>Answer the assessment, log a symptom, chat with ANU, book a consult. Everything responds.</p>
      </div>

      <InteractivePrototype />
    </div>
  );
}

function InteractivePrototype() {
  const [screenId, setScreenId] = React.useState(() => {
    return localStorage.getItem('anuva_screen') || 'assess';
  });
  const [tab, setTab] = React.useState('home');

  React.useEffect(() => {
    localStorage.setItem('anuva_screen', screenId);
    const mapping = { home: 'home', chat: 'anu', track: 'track', report: 'report', content: 'more', qa: 'more', booking: 'more', care: 'more' };
    if (mapping[screenId]) setTab(mapping[screenId]);
  }, [screenId]);

  const navigate = (id) => setScreenId(id);

  return (
    <div className="proto-wrap">
      <div className="screen-menu">
        <div className="hdr">Jump to screen</div>
        {SCREENS.map(s => (
          <button
            key={s.id}
            className={screenId === s.id ? 'active' : ''}
            onClick={() => navigate(s.id)}
          >
            <span className="num">{s.n}</span>
            <span>{s.title}</span>
          </button>
        ))}
      </div>
      <ScreenShell screenId={screenId} tab={tab} setTab={setTab} navigate={navigate} />
    </div>
  );
}

function TweaksPanel({ on, onChange }) {
  const schemes = [
    { id: 'mint',   label: 'Mint (default)', color: '#cebdff' },
    { id: 'butter', label: 'Butter',          color: '#e2c62d' },
    { id: 'blush',  label: 'Blush',           color: '#E8C8D8' },
    { id: 'lilac',  label: 'Lilac',           color: '#C9B8E8' },
  ];
  return (
    <div className={`tweaks ${on ? 'on' : ''}`}>
      <div className="hdr">
        <span>Tweaks</span>
        <Lotus size={20} color="#cebdff" glow/>
      </div>
      <label>Accent scheme</label>
      <div className="swatches">
        {schemes.map(s => (
          <div key={s.id}
            className={`swatch ${TWEAKS.accentScheme === s.id ? 'sel' : ''}`}
            style={{ background: s.color }}
            onClick={() => onChange({ accentScheme: s.id })}
          />
        ))}
      </div>
      <label>User name</label>
      <input
        defaultValue={TWEAKS.userName}
        onChange={e => onChange({ userName: e.target.value })}
        style={{
          width: '100%', background: 'rgba(206, 189, 255, 0.16)',
          border: '1px solid rgba(244,246,242,0.12)',
          color: '#e6e0ea', padding: '9px 12px', borderRadius: 10,
          fontFamily: '"Geist", sans-serif', fontSize: 13, outline: 'none',
        }}
      />
      <div style={{ fontFamily: '"Geist Mono", monospace', fontSize: 9.5, color: 'rgba(244,246,242,0.4)', marginTop: 14, lineHeight: 1.5, letterSpacing: '0.08em' }}>
        Visual swatches preview the palette; full theming on next build.
      </div>
    </div>
  );
}

function App() {
  const [tweaksOn, setTweaksOn] = React.useState(false);

  React.useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') setTweaksOn(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksOn(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  const onTweakChange = (edits) => {
    Object.assign(TWEAKS, edits);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  };

  return (
    <>
      <CanvasView />
      <TweaksPanel on={tweaksOn} onChange={onTweakChange} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
